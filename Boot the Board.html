<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boot the Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen fairground stall — scoreboard strip on top, the stage canvas fills the rest */
:root{
  --sky:#7fd3e6; --saffron:#ff9f1c; --chili:#e63946; --teal:#1d7874; --wood:#8a5a2b; --ink:#2b1d14; --paper:#fff6e5;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--teal);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;max-width:640px;margin:0 auto;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(22px,6vw,32px);margin:0;color:var(--saffron);letter-spacing:.02em;text-shadow:3px 3px 0 var(--ink)}
.stats{display:flex;gap:8px}
.chip{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:4px 10px;text-align:center;min-width:56px;box-shadow:3px 3px 0 var(--ink)}
.chip b{display:block;font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.chip span{font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.stage{position:relative;flex:1;min-height:0;border:4px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);background:var(--sky)}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(43,29,20,.55)}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:20px;max-width:320px;text-align:center;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:400;margin:0;font-size:26px;color:var(--chili);text-wrap:balance}
.card p{margin:0;font-weight:600;line-height:1.45}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button,.btn{font-family:var(--display);font-weight:400;font-size:16px;border:3px solid var(--ink);border-radius:10px;padding:10px 16px;background:var(--saffron);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;display:inline-block}
.btn.alt{background:var(--paper)}
button:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
.hint{font-size:12px;color:var(--paper);text-align:center;font-weight:600;margin:0}
</style>
</head><body>

<div class="app">
  <header>
    <h1>Boot the Board</h1>
    <div class="stats">
      <div class="chip"><b id="score">0</b><span>Score</span></div>
      <div class="chip"><b id="time">30</b><span>Secs</span></div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Game stage: tap to throw shoes at the CEO and the Director"></canvas>
    <div class="overlay" id="start">
      <div class="card">
        <h2>Boot the Board</h2>
        <p>Another window, another "process". Tap anywhere to fling a shoe at the CEO and the Director. They won't stand still. Headshots score double. You get 30 seconds.</p>
        <div class="btns"><button id="go">Start throwing</button></div>
      </div>
    </div>
    <div class="overlay" id="end" hidden>
      <div class="card">
        <h2 id="endTitle">Time up!</h2>
        <p id="endText"></p>
        <div class="btns">
          <button id="again">Play again</button>
          <a class="btn alt" id="tweet" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">Post score</a>
        </div>
      </div>
    </div>
  </div>
  <p class="hint">Sound on. Tap or click to throw.</p>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();

/* ---------- audio: everything synthesized, no files ---------- */
let ac=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function noise(dur,freq,q,vol,when=0){const a=audio();if(!a)return;const t=a.currentTime+when;const len=Math.floor(a.sampleRate*dur);const b=a.createBuffer(1,len,a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(t)}
function whoosh(){const a=audio();if(!a)return;const t=a.currentTime;const len=Math.floor(a.sampleRate*.35);const b=a.createBuffer(1,len,a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.5;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2200,t+.3);const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.08);g.gain.linearRampToValueAtTime(0,t+.35);s.connect(f).connect(g).connect(a.destination);s.start(t)}
// cartoon voice: sawtooth through two vowel formants, with a pitch contour
function voice(base,contour,dur,vowel){const a=audio();if(!a)return;const t=a.currentTime+.02;const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(base*contour[0],t);contour.forEach((m,i)=>{if(i)o.frequency.linearRampToValueAtTime(base*m,t+dur*i/(contour.length-1))});const vib=a.createOscillator();vib.frequency.value=7;const vg=a.createGain();vg.gain.value=base*.04;vib.connect(vg).connect(o.frequency);const mix=a.createGain();mix.gain.value=1;const F={aa:[800,1200],oo:[350,800],ee:[300,2300],ay:[550,1800]}[vowel];F.forEach((fr,i)=>{const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fr;bp.Q.value=6;const g=a.createGain();g.gain.value=i?.6:1;o.connect(bp).connect(g).connect(mix)});const env=a.createGain();env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(.55,t+.03);env.gain.setValueAtTime(.55,t+dur*.7);env.gain.linearRampToValueAtTime(0,t+dur);mix.connect(env).connect(a.destination);o.start(t);vib.start(t);o.stop(t+dur+.05);vib.stop(t+dur+.05)}
const CRIES=[
  {txt:'OWW!',c:[1.2,1.8,1.1],d:.45,v:'aa'},
  {txt:'TRUST THE PROCESS!',c:[1,1.5,1.3,1.1],d:.6,v:'oo'},
  {txt:'NOT THE BUDGET!',c:[1.6,1.9,1.0,.8],d:.6,v:'aa'},
  {txt:"IT'S A RESET!",c:[1.4,1.0,1.6],d:.5,v:'ay'},
  {txt:'STOP IT!',c:[1.1,1.3,1.1,1.4],d:.55,v:'aa'},
  {txt:'WE HAVE A PLAN!',c:[1.3,1.6,1.2,1.5],d:.55,v:'ay'},
  {txt:'EEK!',c:[2,2.4,2.2],d:.25,v:'ee'},
  {txt:'FIVE YEAR PLAN!',c:[1,.8,.9,.7],d:.55,v:'oo'},
];
function thwack(){noise(.12,900,1.2,1.4);noise(.06,2500,2,.6)}
function clatter(){noise(.08,1800,4,.5);noise(.08,1400,4,.4,.12);noise(.06,1600,4,.25,.22)}

/* ---------- characters ---------- */
const people=[
  {name:'THE CEO',kurta:'#1b1b1f',skin:'#f3cfb3',hair:'#4a3426',voice:150,stache:true,cap:false,x:0,phase:0,speed:1.1,hit:0,cry:'',stars:0,duck:0},
  {name:'THE DIRECTOR',kurta:'#1b1b1f',skin:'#f6d6c0',hair:'#9a9a9a',voice:300,stache:false,cap:false,x:0,phase:Math.PI,speed:1.4,hit:0,cry:'',stars:0,duck:0},
];
let score=0,timeLeft=30,running=false,clock=0,shoes=[],pops=[],last=performance.now();

function geom(p,i){
  const s=Math.min(W/420,H/520);
  const counterY=H*.66;
  const range=W*.18;
  const base=W*(i?0.68:0.32);
  const x=base+Math.sin(clock*p.speed*(1+score*.02)+p.phase)*range;
  const duckOff=p.duck>0?Math.sin(Math.min(p.duck,1)*Math.PI)*60*s:0;
  const bodyTop=counterY-95*s+duckOff;
  const headY=bodyTop-34*s;
  return {s,x,counterY,bodyTop,headY,headR:34*s,bodyW:80*s};
}

function drawPerson(p,i){
  const g=geom(p,i),{s,x,bodyTop,headY,headR,bodyW}=g;
  ctx.save();
  const wob=p.hit>0?Math.sin(p.hit*40)*.25*p.hit:0;
  ctx.translate(x,g.counterY);ctx.rotate(wob);ctx.translate(-x,-g.counterY);
  ctx.lineWidth=4*s;ctx.strokeStyle='#2b1d14';ctx.lineJoin='round';ctx.lineCap='round';
  // arms
  const flail=p.hit>0?Math.sin(p.hit*30)*.8:Math.sin(clock*3+i)*.2;
  [-1,1].forEach(side=>{
    ctx.beginPath();const sx=x+side*bodyW*.45,sy=bodyTop+18*s;
    const ang=(p.hit>0?-1.2:0.4)+flail*side;
    const hx=sx+side*Math.cos(ang)*50*s,hy=sy-Math.sin(ang)*50*s*(p.hit>0?1:-1);
    ctx.moveTo(sx,sy);ctx.lineTo(hx,hy);
    ctx.lineWidth=14*s;ctx.strokeStyle='#2b1d14';ctx.stroke();ctx.lineWidth=9*s;ctx.strokeStyle=p.kurta;ctx.stroke();
    ctx.beginPath();ctx.arc(hx,hy,7*s,0,7);ctx.fillStyle=p.skin;ctx.fill();ctx.lineWidth=3*s;ctx.strokeStyle='#2b1d14';ctx.stroke();
  });
  ctx.lineWidth=4*s;ctx.strokeStyle='#2b1d14';
  // body
  // black coat
  ctx.fillStyle=p.kurta;ctx.beginPath();ctx.roundRect(x-bodyW/2,bodyTop,bodyW,140*s,[22*s,22*s,0,0]);ctx.fill();ctx.stroke();
  // white shirt V
  const vy=bodyTop+62*s;
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(x-20*s,bodyTop+1*s);ctx.lineTo(x+20*s,bodyTop+1*s);ctx.lineTo(x,vy);ctx.closePath();ctx.fill();
  // lapels
  ctx.fillStyle='#2e2e35';ctx.lineWidth=2.5*s;
  [-1,1].forEach(side=>{ctx.beginPath();ctx.moveTo(x+side*20*s,bodyTop+1*s);ctx.lineTo(x+side*30*s,bodyTop+26*s);ctx.lineTo(x+side*18*s,bodyTop+30*s);ctx.lineTo(x,vy);ctx.closePath();ctx.fill();ctx.stroke()});
  // shirt collar
  ctx.fillStyle='#ffffff';[-1,1].forEach(side=>{ctx.beginPath();ctx.moveTo(x,bodyTop+8*s);ctx.lineTo(x+side*14*s,bodyTop+1*s);ctx.lineTo(x+side*8*s,bodyTop+14*s);ctx.closePath();ctx.fill();ctx.stroke()});
  // red tie
  ctx.fillStyle='#d62828';ctx.lineWidth=2.5*s;
  ctx.beginPath();ctx.moveTo(x-5*s,bodyTop+8*s);ctx.lineTo(x+5*s,bodyTop+8*s);ctx.lineTo(x+4*s,bodyTop+16*s);ctx.lineTo(x-4*s,bodyTop+16*s);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-4*s,bodyTop+16*s);ctx.lineTo(x+4*s,bodyTop+16*s);ctx.lineTo(x+8*s,bodyTop+50*s);ctx.lineTo(x,bodyTop+60*s);ctx.lineTo(x-8*s,bodyTop+50*s);ctx.closePath();ctx.fill();ctx.stroke();
  // coat buttons
  [72,90].forEach(b=>{ctx.beginPath();ctx.arc(x,bodyTop+b*s,3*s,0,7);ctx.fillStyle='#55555c';ctx.fill()});
  ctx.lineWidth=4*s;
  // head
  ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(x,headY,headR,0,Math.PI*2);ctx.fill();ctx.stroke();
  // ears
  [-1,1].forEach(side=>{ctx.beginPath();ctx.arc(x+side*headR,headY+4*s,8*s,0,7);ctx.fillStyle=p.skin;ctx.fill();ctx.stroke()});
  ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(x,headY,headR-2*s,0,7);ctx.fill();
  // hair / cap
  ctx.fillStyle='#2b1d14';
  if(p.cap){ctx.fillStyle='#1d7874';ctx.beginPath();ctx.arc(x,headY-headR*.35,headR*.95,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.roundRect(x-4*s,headY-headR*.4,headR*1.4,8*s,4*s);ctx.fill();ctx.stroke()}
  else{ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(x,headY-headR*.25,headR*.98,Math.PI*1.05,Math.PI*1.95);ctx.quadraticCurveTo(x,headY-headR*.3,x-headR*.95,headY-headR*.4);ctx.fill();ctx.lineWidth=2.5*s;ctx.stroke();ctx.lineWidth=4*s}
  // face
  const ex=12*s,ey=headY-2*s;
  ctx.strokeStyle='#2b1d14';ctx.fillStyle='#2b1d14';
  if(p.hit>0){
    // flushed cheeks
    ctx.fillStyle='rgba(220,60,60,.45)';[-1,1].forEach(side=>{ctx.beginPath();ctx.ellipse(x+side*20*s,headY+8*s,8*s,5*s,0,0,7);ctx.fill()});
    // angry slanted brows
    ctx.lineWidth=4.5*s;[-1,1].forEach(side=>{ctx.beginPath();ctx.moveTo(x+side*20*s,ey-14*s);ctx.lineTo(x+side*5*s,ey-7*s);ctx.stroke()});
    // squeezed shut eyes
    ctx.lineWidth=3.5*s;[-1,1].forEach(side=>{const cx=x+side*ex;ctx.beginPath();ctx.moveTo(cx-side*6*s,ey-4*s);ctx.lineTo(cx+side*3*s,ey);ctx.lineTo(cx-side*6*s,ey+4*s);ctx.stroke()});
    // tears
    ctx.fillStyle='#7fd3e6';ctx.lineWidth=2*s;[-1,1].forEach(side=>{const tx=x+side*(ex+4*s),ty=ey+8*s+(1-p.hit)*14*s;ctx.beginPath();ctx.moveTo(tx,ty-6*s);ctx.quadraticCurveTo(tx+4*s,ty,tx,ty+3*s);ctx.quadraticCurveTo(tx-4*s,ty,tx,ty-6*s);ctx.fill();ctx.stroke()});
    // wailing frown
    ctx.lineWidth=4*s;ctx.fillStyle='#7a1f1f';ctx.beginPath();ctx.moveTo(x-11*s,headY+22*s);ctx.quadraticCurveTo(x,headY+8*s,x+11*s,headY+22*s);ctx.quadraticCurveTo(x,headY+18*s,x-11*s,headY+22*s);ctx.closePath();ctx.fill();ctx.stroke();
  }else{
    const look=Math.sin(clock*2+i)*2*s;
    [-1,1].forEach(side=>{ctx.beginPath();ctx.arc(x+side*ex,ey,6*s,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(x+side*ex+look,ey+1*s,2.6*s,0,7);ctx.fillStyle='#2b1d14';ctx.fill()});
    ctx.beginPath();ctx.arc(x,headY+12*s,10*s,.15*Math.PI,.85*Math.PI);ctx.stroke();
  }
  if(p.stache){ctx.fillStyle='#2b1d14';ctx.beginPath();ctx.ellipse(x-8*s,headY+9*s,9*s,4*s,-.2,0,7);ctx.ellipse(x+8*s,headY+9*s,9*s,4*s,.2,0,7);ctx.fill()}
  // dizzy stars
  if(p.stars>0){for(let k=0;k<3;k++){const a=clock*6+k*2.1;star(x+Math.cos(a)*headR*1.2,headY-headR-8*s+Math.sin(a)*8*s,7*s)}}
  ctx.restore();
  // name tag
  ctx.font=`400 ${Math.max(11,14*s)}px Bungee, Arial Black, sans-serif`;ctx.textAlign='center';
  // speech bubble
  if(p.hit>0&&p.cry){
    const by=headY-headR-40*s;
    ctx.font=`400 ${Math.max(12,18*s)}px Bungee, Arial Black, sans-serif`;
    const tw=ctx.measureText(p.cry).width+20*s;
    const bx=Math.min(W-tw/2-6,Math.max(tw/2+6,x+(i?-1:1)*50*s));
    ctx.fillStyle='#fff6e5';ctx.strokeStyle='#2b1d14';ctx.lineWidth=3*s;
    ctx.beginPath();ctx.roundRect(bx-tw/2,by-18*s,tw,34*s,10*s);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e63946';ctx.fillText(p.cry,bx,by+7*s);
  }
}
function star(x,y,r){ctx.save();ctx.fillStyle='#ffd23f';ctx.strokeStyle='#2b1d14';ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}

function drawShoe(x,y,sc,rot,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.lineWidth=3;ctx.strokeStyle='#2b1d14';
  // shoe sole
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,26,11,0,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='#2b1d14';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-6,-9);ctx.quadraticCurveTo(6,2,-6,9);ctx.stroke();
  ctx.strokeStyle='#fff6e5';ctx.lineWidth=2.5;ctx.stroke();
  ctx.restore();
}

function drawStall(){
  // sky gradient + sun
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7fd3e6');gr.addColorStop(1,'#bfe9f2');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(W*.86,H*.2,Math.min(W,H)*.07,0,7);ctx.fill();
  // back wall
  ctx.fillStyle='#ffe8c2';ctx.fillRect(W*.04,H*.18,W*.92,H*.5);
  ctx.strokeStyle='#2b1d14';ctx.lineWidth=4;ctx.strokeRect(W*.04,H*.18,W*.92,H*.5);
  // awning stripes
  const n=9,aw=W*.96/n,ay=H*.1,ah=H*.1;
  for(let k=0;k<n;k++){ctx.fillStyle=k%2?'#fff6e5':'#e63946';ctx.beginPath();const x0=W*.02+k*aw;ctx.moveTo(x0,ay);ctx.lineTo(x0+aw,ay);ctx.lineTo(x0+aw,ay+ah);ctx.arc(x0+aw/2,ay+ah,aw/2,0,Math.PI);ctx.closePath();ctx.fill();ctx.stroke()}
  // bunting
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.04,H*.23);ctx.quadraticCurveTo(W*.5,H*.3,W*.96,H*.23);ctx.stroke();
  for(let k=1;k<12;k++){const t=k/12,bx=W*.04+t*W*.92,by=H*.23+Math.sin(t*Math.PI)*H*.035;ctx.fillStyle=['#ff9f1c','#1d7874','#ffd23f','#e63946'][k%4];ctx.beginPath();ctx.moveTo(bx-8,by);ctx.lineTo(bx+8,by);ctx.lineTo(bx,by+16);ctx.closePath();ctx.fill();ctx.stroke()}
}
function drawCounter(){
  const cy=H*.66;
  ctx.fillStyle='#8a5a2b';ctx.fillRect(0,cy,W,H-cy);
  ctx.strokeStyle='#2b1d14';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();
  ctx.fillStyle='#a8743d';ctx.fillRect(0,cy,W,14);ctx.strokeRect(-4,cy,W+8,14);
  ctx.strokeStyle='rgba(43,29,20,.35)';ctx.lineWidth=2;
  for(let k=1;k<6;k++){const y=cy+14+k*(H-cy)/6;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // sign
  const s=Math.min(W/420,H/520);ctx.fillStyle='#fff6e5';ctx.strokeStyle='#2b1d14';ctx.lineWidth=3;
  const sw=200*s,sh=36*s;ctx.beginPath();ctx.roundRect(W/2-sw/2,cy+28*s,sw,sh,8*s);ctx.fill();ctx.stroke();
  ctx.fillStyle='#2b1d14';ctx.font=`400 ${15*s}px Bungee, Arial Black, sans-serif`;ctx.textAlign='center';ctx.fillText('FREE THROWS',W/2,cy+52*s);
  // name tags
  people.forEach((p,i)=>{const g=geom(p,i);ctx.font=`400 ${Math.max(11,13*s)}px Bungee, Arial Black, sans-serif`;ctx.fillStyle='#fff6e5';ctx.fillText(p.name,g.x,cy-6*s+0)});
}

/* ---------- throwing ---------- */
const COLORS=['#1d7874','#ff9f1c','#e63946','#6a4c93'];
function throwAt(tx,ty){
  if(!running)return;
  audio();whoosh();
  shoes.push({sx:W/2,sy:H+20,tx,ty,t:0,dur:.42,rot:0,spin:(Math.random()<.5?-1:1)*(14+Math.random()*6),col:COLORS[Math.floor(Math.random()*4)],state:'fly',vx:0,vy:0,x:W/2,y:H,sc:1.4,alpha:1});
}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();throwAt(e.clientX-r.left,e.clientY-r.top)});

function resolve(sh){
  for(let i=0;i<people.length;i++){
    const p=people[i],g=geom(p,i);
    const dxh=sh.x-g.x,dyh=sh.y-g.headY;
    const head=dxh*dxh+dyh*dyh<(g.headR+10*g.s)**2;
    const body=!head&&Math.abs(sh.x-g.x)<g.bodyW/2+8*g.s&&sh.y>g.bodyTop-4*g.s&&sh.y<g.counterY;
    if(head||body){
      const pts=head?2:1;score+=pts;$('score').textContent=score;
      const cry=CRIES[Math.floor(Math.random()*CRIES.length)];
      p.hit=1;p.cry=cry.txt;p.stars=head?1.6:0;
      thwack();voice(p.voice*(.9+Math.random()*.2),cry.c,cry.d,cry.v);
      pops.push({x:sh.x,y:sh.y-20,txt:'+'+pts,t:1});
      sh.state='bounce';sh.vx=(sh.x<g.x?-1:1)*(120+Math.random()*80);sh.vy=-260;
      // the other one laughs, the hit one may duck next time
      if(Math.random()<.35)people[1-i].duck=0.001;
      return;
    }
  }
  sh.state='fall';sh.vx=(Math.random()-.5)*60;sh.vy=-60;clatterTimer=.25;
}
let clatterTimer=0;

/* ---------- loop ---------- */
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(running){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;end()}$('time').textContent=Math.ceil(timeLeft)}
  if(clatterTimer>0){clatterTimer-=dt;if(clatterTimer<=0)clatter()}
  people.forEach(p=>{if(p.hit>0)p.hit=Math.max(0,p.hit-dt*1.3);if(p.stars>0)p.stars-=dt;if(p.duck>0){p.duck+=dt*2.2;if(p.duck>1)p.duck=0}
    if(running&&p.duck===0&&Math.random()<dt*.25)p.duck=0.001});
  ctx.clearRect(0,0,W,H);drawStall();
  people.forEach(drawPerson);
  drawCounter();
  shoes.forEach(sh=>{
    if(sh.state==='fly'){
      sh.t+=dt/sh.dur;const t=Math.min(1,sh.t);
      sh.x=sh.sx+(sh.tx-sh.sx)*t;sh.y=sh.sy+(sh.ty-sh.sy)*t-Math.sin(Math.PI*t)*H*.18;sh.sc=1.4-t*.7;sh.rot+=sh.spin*dt;
      if(t>=1)resolve(sh);
    }else{
      sh.vy+=900*dt;sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.rot+=sh.spin*dt*.5;sh.alpha-=dt*1.1;
    }
    ctx.globalAlpha=Math.max(0,sh.alpha);drawShoe(sh.x,sh.y,sh.sc,sh.rot,sh.col);ctx.globalAlpha=1;
  });
  shoes=shoes.filter(s=>s.alpha>0&&s.y<H+80);
  pops.forEach(pp=>{pp.t-=dt;pp.y-=40*dt;ctx.globalAlpha=Math.max(0,pp.t);ctx.font='400 26px Bungee, Arial Black, sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#2b1d14';ctx.strokeText(pp.txt,pp.x,pp.y);ctx.fillStyle='#ffd23f';ctx.fillText(pp.txt,pp.x,pp.y);ctx.globalAlpha=1});
  pops=pops.filter(pp=>pp.t>0);
  requestAnimationFrame(frame);
}

function start(){audio();score=0;timeLeft=30;shoes=[];pops=[];$('score').textContent=0;$('time').textContent=30;$('start').hidden=true;$('end').hidden=true;running=true}
function end(){
  running=false;
  const r=score>=40?'Boardroom destroyer!':score>=25?'Sharp shooter!':score>=12?'Not bad at all!':'Warm-up round?';
  $('endTitle').textContent=r;
  $('endText').textContent=`You scored ${score} points on the CEO and the Director in 30 seconds. They are calling it a positive step.`;
  const txt=`I landed ${score} points on the CEO and the Director in Boot the Board. They say it's all part of the process. Beat me:`;
  $('tweet').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(txt);
  $('end').hidden=false;
}
$('go').addEventListener('click',start);
$('again').addEventListener('click',start);
requestAnimationFrame(frame);
})();
</script>
